<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Blue rounded square background -->
  <rect width="200" height="200" rx="44" fill="#2563EB"/>

  <!-- Map grid pattern - light blue -->
  <g opacity="0.3" fill="#BFDBFE">
    <!-- Top left section -->
    <path d="M30 30 L85 30 L70 85 L30 70 Z"/>
    <!-- Top right section -->
    <path d="M115 30 L170 30 L170 70 L130 85 Z"/>
    <!-- Bottom left section -->
    <path d="M30 130 L70 115 L85 170 L30 170 Z"/>
    <!-- Bottom right section -->
    <path d="M130 115 L170 130 L170 170 L115 170 Z"/>
  </g>

  <!-- Map grid pattern - white -->
  <g fill="white">
    <!-- Center top section -->
    <path d="M85 30 L115 30 L130 85 L70 85 Z"/>
    <!-- Center left section -->
    <path d="M30 70 L70 85 L70 115 L30 130 Z"/>
    <!-- Center right section -->
    <path d="M130 85 L170 70 L170 130 L130 115 Z"/>
    <!-- Center bottom section -->
    <path d="M70 115 L85 170 L115 170 L130 115 Z"/>
  </g>

  <!-- Blue diagonal road lines -->
  <g stroke="#2563EB" stroke-width="8" opacity="1">
    <line x1="70" y1="30" x2="30" y2="100" stroke-linecap="round"/>
    <line x1="130" y1="30" x2="170" y2="100" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="70" y2="170" stroke-linecap="round"/>
    <line x1="170" y1="100" x2="130" y2="170" stroke-linecap="round"/>
  </g>

  <!-- Red map pin marker -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="-10" r="28" fill="#EF4444"/>
    <circle cx="0" cy="-10" r="10" fill="white"/>
    <path d="M0 18 C-3 14, -5 10, -5 5 L5 5 C5 10, 3 14, 0 18 Z" fill="#EF4444"/>
  </g>
</svg>
