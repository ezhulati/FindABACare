<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Location Pin with Infinity Symbol (Neurodiversity Symbol) -->
  <defs>
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0080;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#7928CA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0070F3;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#00DFD8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pinBlueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Pin Shadow -->
  <ellipse cx="256" cy="485" rx="50" ry="15" fill="#000000" opacity="0.2"/>

  <!-- Pin Body -->
  <path d="M 256 40
           C 180 40 120 100 120 176
           C 120 280 256 470 256 470
           C 256 470 392 280 392 176
           C 392 100 332 40 256 40 Z"
        fill="url(#pinBlueGradient)"
        stroke="#1E40AF"
        stroke-width="6"/>

  <!-- Inner Circle Background -->
  <circle cx="256" cy="176" r="85" fill="white"/>

  <!-- Rainbow Infinity Symbol (Neurodiversity Symbol) -->
  <g transform="translate(256, 176)">
    <path d="M -60 0
             C -60 -25 -45 -35 -30 -35
             C -10 -35 5 -20 30 0
             C 55 20 70 35 90 35
             C 105 35 120 25 120 0
             C 120 -25 105 -35 90 -35
             C 70 -35 55 -20 30 0
             C 5 20 -10 35 -30 35
             C -45 35 -60 25 -60 0 Z"
          fill="none"
          stroke="url(#rainbowGradient)"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
