<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Blue rounded square background -->
  <rect width="180" height="180" rx="40" fill="#2563EB"/>

  <!-- Map grid pattern - light blue -->
  <g opacity="0.3" fill="#BFDBFE">
    <path d="M27 27 L76 27 L63 76 L27 63 Z"/>
    <path d="M104 27 L153 27 L153 63 L117 76 Z"/>
    <path d="M27 117 L63 104 L76 153 L27 153 Z"/>
    <path d="M117 104 L153 117 L153 153 L104 153 Z"/>
  </g>

  <!-- White center sections -->
  <g fill="white">
    <path d="M76 27 L104 27 L117 76 L63 76 Z"/>
    <path d="M27 63 L63 76 L63 104 L27 117 Z"/>
    <path d="M117 76 L153 63 L153 117 L117 104 Z"/>
    <path d="M63 104 L76 153 L104 153 L117 104 Z"/>
  </g>

  <!-- Blue diagonal roads -->
  <g stroke="#2563EB" stroke-width="7">
    <line x1="63" y1="27" x2="27" y2="90"/>
    <line x1="117" y1="27" x2="153" y2="90"/>
    <line x1="27" y1="90" x2="63" y2="153"/>
    <line x1="153" y1="90" x2="117" y2="153"/>
  </g>

  <!-- Red map pin marker -->
  <g transform="translate(90, 90)">
    <circle cx="0" cy="-9" r="25" fill="#EF4444"/>
    <circle cx="0" cy="-9" r="9" fill="white"/>
    <path d="M0 16 C-2.7 12.6, -4.5 9, -4.5 4.5 L4.5 4.5 C4.5 9, 2.7 12.6, 0 16 Z" fill="#EF4444"/>
  </g>
</svg>
