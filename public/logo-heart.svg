<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Location Pin with Heart - PRIMARY RECOMMENDATION -->
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Pin Shadow -->
  <ellipse cx="256" cy="485" rx="50" ry="15" fill="#000000" opacity="0.2"/>

  <!-- Pin Body -->
  <path d="M 256 40
           C 180 40 120 100 120 176
           C 120 280 256 470 256 470
           C 256 470 392 280 392 176
           C 392 100 332 40 256 40 Z"
        fill="url(#pinGradient)"
        stroke="#1E40AF"
        stroke-width="6"/>

  <!-- Inner Circle Background -->
  <circle cx="256" cy="176" r="85" fill="white"/>

  <!-- Heart Symbol -->
  <path d="M 256 220
           L 234 198
           C 224 188 210 184 198 188
           C 180 194 172 210 172 224
           C 172 238 180 250 190 260
           L 256 326
           L 322 260
           C 332 250 340 238 340 224
           C 340 210 332 194 314 188
           C 302 184 288 188 278 198
           L 256 220 Z"
        fill="#EC4899"
        stroke="#DB2777"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>
